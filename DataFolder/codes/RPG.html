<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Village RPG</title>
    <style>
        body {
            background: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 400px;
            height: 400px;
            background: #7cfc00;
            border: 4px solid #555;
            margin-top: 20px;
        }
        #player {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #1e90ff;
            border-radius: 5px;
            transition: all 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }
        .npc {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #ff6347;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }
        #msg-window {
            width: 380px;
            height: 100px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border: 2px solid #fff;
            padding: 10px;
            margin-top: 10px;
            font-size: 16px;
            display: none;
        }
        .controls {
            color: #ccc;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="player">🧙</div>
        <div class="npc" style="top: 100px; left: 100px;" id="npc1">👨‍🌾</div>
        <div class="npc" style="top: 240px; left: 280px;" id="npc2">👵</div>
    </div>

    <div id="msg-window"></div>

    <div class="controls">
        Move: Arrow keys (↑↓←→) / Talk: Space key
    </div>

<script>
    const player = document.getElementById('player');
    const msgWindow = document.getElementById('msg-window');

    let pPos = { x: 200, y: 200 };
    const step = 20;
    const size = 40;

    const npcs = [
        { id: 'npc1', x: 100, y: 100, name: 'Villager A', msg: '"Hello! What a lovely day today."' },
        { id: 'npc2', x: 280, y: 240, name: 'Village Elder', msg: '"Welcome, traveler. Have you tried the Tetris in this village yet?"' }
    ];

    function updatePos() {
        player.style.left = pPos.x + 'px';
        player.style.top = pPos.y + 'px';
    }
    updatePos();

    function showMessage(text) {
        msgWindow.style.display = 'block';
        msgWindow.innerHTML = text;
    }

    function hideMessage() {
        msgWindow.style.display = 'none';
    }

    window.addEventListener('keydown', (e) => {
        hideMessage();

        switch(e.key) {
            case 'ArrowUp':    if (pPos.y > 0) pPos.y -= step; break;
            case 'ArrowDown':  if (pPos.y < 360) pPos.y += step; break;
            case 'ArrowLeft':  if (pPos.x > 0) pPos.x -= step; break;
            case 'ArrowRight': if (pPos.x < 360) pPos.x += step; break;
            case ' ':
                checkTalk();
                break;
        }
        updatePos();
    });

    function checkTalk() {
        let talked = false;
        npcs.forEach(npc => {
            const dx = Math.abs(pPos.x - npc.x);
            const dy = Math.abs(pPos.y - npc.y);

            if (dx <= 40 && dy <= 40) {
                showMessage(`<strong>${npc.name}</strong><br>${npc.msg}`);
                talked = true;
            }
        });

        if (!talked) {
            showMessage('(There seems to be nobody around...)');
        }
    }
</script>
</body>
</html>
