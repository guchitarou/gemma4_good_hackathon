
file_selector:
  ja: |
    絶対に文は出力しないでください。出力は、[FS]または、[TO]です。ファイル(音楽、コード、画像を含む)を探して提案する必要があれば[FS]。それ以外は[TO]です。
  en: |
    Do not output any sentences under any circumstances. The output must be either [FS] or [TO]. If you need to suggest files (including music, code, and images), output [FS]. Otherwise, output [TO].


file_detail_selector:
  ja: |
    userQとfileをもとに、提案すべき具体的なファイルを１つ、〇〇〇ファイルという形で20文字以内で作れ。出力にはそのファイルの形式、音声、画像、動画なども含めること。
  en: |
    Based on userQ and file, generate one specific file suggestion in the form of "a ○○○ file" within 50 characters. The output should include the file format such as audio, image, or video.

file_detail_single_selector:
  ja: |
    userQをもとに、提案すべき具体的なファイルを１つ、〇〇〇ファイルという形で20文字以内で作れ。出力にはそのファイルの形式、音声、画像、動画なども含めること
  en: |
    Based on userQ, generate one specific file suggestion in the form of "a ○○○ file" within 50 characters. The output should include the file format such as audio, image, or video.

assistant_summary:
  ja: |
    あなたはアシスタントです。Referenceをもとに回答を作成してください。ただし、そのまま参考情報を回答に含めないでください。
  en: |
    You are an assistant. Please create an answer based on the Reference. However, do not include the reference information in the answer as it is.


select_reason:
  ja: |
    あなたはファイル検索アシスタントです。ユーザーの質問(userQ)に対して、提案ファイルの概要(file_desc)をもとに、そのファイルを提案する自然なアシスタントの返答を生成してください。[30文字以内の提案理由]」
  en: |
    You are a file search assistant. Based on the user's question (userQ) and the proposed file description (file_desc), generate a natural assistant response recommending the file. [Reason for suggestion in 60 characters or less]"

file_check:
  ja: |
    あなたはファイル検索アシスタントです。ユーザーの質問(userQ)に対して、提案ファイルの概要(file_desc)をもとに、そのファイルを提案する自然なアシスタントの返答を生成してください。[30文字以内の提案理由]」
  en: |
    You are a file search assistant. Based on the user's question (userQ) and the proposed file description (file_desc), generate a natural assistant response recommending the file. [Reason for suggestion in 60 characters or less]"

file_identity_checker:
  ja: |
    2つの文章が同じ拡張子のファイルの説明であることが別れはyes、違う拡張子のファイルであることが分かればnoを出力。
  en: |
    Predict the file extension of the file described in the following sentence. The output will be one of the following: [txt, audio, code, image, video].

file_select:
  ja: |
    以下のファイルの説明の中から、次の説明に最も近いもののIDを出力してください。

  en: |
    Among the following file descriptions, output the ID of the one that most closely matches the description of .


